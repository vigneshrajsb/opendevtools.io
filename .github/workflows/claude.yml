name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits
      pull-requests: write # Required to update PRs
      issues: write # Required to comment on issues
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          custom_instructions: |
            When completing work on an issue:
            - Always create a pull request using mcp__github__create_pull_request after pushing changes
            - Do not just push to a branch and provide a manual link
            - The PR title should follow conventional commits (feat:, fix:, etc.)
            - The PR body should reference the original issue with "Closes #<issue_number>"

          # Allowed tools for Claude to use
          # Development: pnpm dev/build/lint
          # Testing: playwright test with various options
          # Snapshots: update e2e test snapshots
          # Git: git operations for commits
          allowed_tools: |
            Bash(pnpm:*)
            Bash(npx:*)
            Bash(git:*)
            Bash(tilt:*)
            Bash(ls:*)
            Bash(mkdir:*)
            Bash(cat:*)
            Bash(head:*)
            Bash(tail:*)
            Edit
            Write
            Read
            mcp__github__create_or_update_file
            mcp__github__push_files
            mcp__github__create_branch
            mcp__github__create_pull_request

